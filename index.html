<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Making 3D</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #101010;
      color: white;
      overflow: hidden;
    }

    header {
      height: 60px;
      background: #181818;
      display: flex;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 20px;
    }

    #app {
      height: calc(100vh - 60px);
      display: flex;
    }

    /* Left panel */
    #sidebar {
      width: 300px;
      background: #181818;
      padding: 15px;
      overflow-y: auto;
      border-right: 1px solid #333;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #252525;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      resize: none;
      outline: none;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 9px;
      background: #ffffff;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #dddddd;
    }

    .secondary {
      background: #292929;
      color: white;
      border: 1px solid #444;
    }

    h3 {
      margin: 18px 0 10px;
      font-size: 14px;
      color: #aaa;
    }

    #objects {
      background: #222;
      border-radius: 10px;
      padding: 8px;
      min-height: 80px;
    }

    .object {
      padding: 9px;
      background: #2d2d2d;
      margin-bottom: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 3D area */
    #scene {
      flex: 1;
      position: relative;
    }

    #canvas {
      width: 100%;
      height: 100%;
    }

    /* Timeline */
    #timeline {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: rgba(20,20,20,0.95);
      border-top: 1px solid #444;
      padding: 12px;
    }

    #timeline input {
      width: 100%;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .controls button {
      width: auto;
      flex: 1;
    }

    #status {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }

    @media(max-width: 700px) {
      #sidebar {
        width: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎬 Animation Making 3D</h1>
</header>

<div id="app">

  <!-- LEFT PANEL -->
  <aside id="sidebar">

    <h3>AI Animation Prompt</h3>

    <textarea id="prompt"
      placeholder="Example: Create a red car driving on a road"></textarea>

    <button onclick="generateAnimation()">
      ✨ Generate Animation
    </button>

    <button class="secondary" onclick="addCube()">
      🧊 Add Cube
    </button>

    <button class="secondary" onclick="addSphere()">
      ⚪ Add Sphere
    </button>

    <button class="secondary" onclick="addCar()">
      🚗 Add Car
    </button>

    <h3>Scene Objects</h3>

    <div id="objects"></div>

    <h3>Animation</h3>

    <div class="controls">
      <button onclick="playAnimation()">▶ Play</button>
      <button onclick="stopAnimation()">■ Stop</button>
    </div>

    <button class="secondary" onclick="clearScene()">
      🗑 Clear Scene
    </button>

    <button class="secondary" onclick="saveScene()">
      💾 Save Scene
    </button>

    <button class="secondary" onclick="loadScene()">
      📂 Load Scene
    </button>

    <p id="status">Ready</p>

  </aside>

  <!-- 3D VIEW -->
  <main id="scene">
    <canvas id="canvas"></canvas>

    <div id="timeline">
      <input
        id="timeSlider"
        type="range"
        min="0"
        max="100"
        value="0"
        oninput="changeTimeline(this.value)"
      >

      <div class="controls">
        <button onclick="previousFrame()">◀</button>
        <button onclick="playAnimation()">▶</button>
        <button onclick="nextFrame()">▶</button>
      </div>
    </div>
  </main>

</div>


<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

  let scene;
  let camera;
  let renderer;
  let objects = [];
  let animationRunning = false;
  let animationTime = 0;

  // -------------------------
  // CREATE 3D SCENE
  // -------------------------

  function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x111111);

    camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(7, 5, 9);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById("canvas"),
      antialias: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(
      document.getElementById("scene").clientWidth,
      document.getElementById("scene").clientHeight
    );

    // Lighting

    const ambient = new THREE.AmbientLight(
      0xffffff,
      0.6
    );

    scene.add(ambient);

    const light = new THREE.DirectionalLight(
      0xffffff,
      1
    );

    light.position.set(5, 10, 5);
    scene.add(light);

    // Ground

    const groundGeometry =
      new THREE.PlaneGeometry(50, 50);

    const groundMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x333333
      });

    const ground =
      new THREE.Mesh(
        groundGeometry,
        groundMaterial
      );

    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1;

    scene.add(ground);

    animate();
  }


  // -------------------------
  // RENDER LOOP
  // -------------------------

  function animate() {

    requestAnimationFrame(animate);

    if (animationRunning) {

      animationTime += 0.02;

      objects.forEach((obj, index) => {

        if (obj.userData.animated) {

          obj.position.x =
            Math.sin(animationTime + index) * 3;

          obj.rotation.y += 0.02;

        }

      });
    }

    renderer.render(scene, camera);
  }


  // -------------------------
  // ADD CUBE
  // -------------------------

  function addCube() {

    const geometry =
      new THREE.BoxGeometry(1,1,1);

    const material =
      new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff
      });

    const cube =
      new THREE.Mesh(
        geometry,
        material
      );

    cube.position.y = 0;

    cube.userData.type = "Cube";
    cube.userData.animated = true;

    scene.add(cube);

    objects.push(cube);

    updateObjectList();

    status("Cube added");
  }


  // -------------------------
  // ADD SPHERE
  // -------------------------

  function addSphere() {

    const geometry =
      new THREE.SphereGeometry(0.7,32,32);

    const material =
      new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff
      });

    const sphere =
      new THREE.Mesh(
        geometry,
        material
      );

    sphere.position.y = 0;

    sphere.userData.type = "Sphere";
    sphere.userData.animated = true;

    scene.add(sphere);

    objects.push(sphere);

    updateObjectList();

    status("Sphere added");
  }


  // -------------------------
  // ADD SIMPLE CAR
  // -------------------------

  function addCar() {

    const car = new THREE.Group();

    // Body

    const bodyGeometry =
      new THREE.BoxGeometry(3,1,1.4);

    const bodyMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xff0000
      });

    const body =
      new THREE.Mesh(
        bodyGeometry,
        bodyMaterial
      );

    body.position.y = 0.5;

    car.add(body);


    // Roof

    const roofGeometry =
      new THREE.BoxGeometry(1.5,0.7,1.2);

    const roof =
      new THREE.Mesh(
        roofGeometry,
        bodyMaterial
      );

    roof.position.y = 1.2;

    car.add(roof);


    // Wheels

    for(let x of [-1.1,1.1]) {

      for(let z of [-0.75,0.75]) {

        const wheelGeometry =
          new THREE.CylinderGeometry(
            0.35,
            0.35,
            0.25,
            32
          );

        const wheelMaterial =
          new THREE.MeshStandardMaterial({
            color: 0x111111
          });

        const wheel =
          new THREE.Mesh(
            wheelGeometry,
            wheelMaterial
          );

        wheel.rotation.x =
          Math.PI / 2;

        wheel.position.set(
          x,
          0.1,
          z
        );

        car.add(wheel);
      }
    }

    car.position.y = -0.5;

    car.userData.type = "Car";
    car.userData.animated = true;

    scene.add(car);

    objects.push(car);

    updateObjectList();

    status("Car added");
  }


  // -------------------------
  // AI PROMPT SYSTEM
  // -------------------------

  function generateAnimation() {

    const prompt =
      document.getElementById("prompt").value
      .toLowerCase();

    if(!prompt.trim()) {

      status("Please enter a prompt");

      return;
    }

    status("Creating 3D animation...");

    /*
      BASIC PROMPT UNDERSTANDING

      This prototype detects keywords.

      Example:
      "red car driving"
      "create a sphere"
      "cube spinning"
    */

    if(prompt.includes("car")) {

      addCar();

      objects[
        objects.length - 1
      ].userData.animated = true;
    }

    else if(prompt.includes("sphere") ||
            prompt.includes("ball")) {

      addSphere();
    }

    else if(prompt.includes("cube") ||
            prompt.includes("box")) {

      addCube();
    }

    else {

      addCube();
    }

    status(
      "Animation created from your prompt"
    );
  }


  // -------------------------
  // PLAY
  // -------------------------

  function playAnimation() {

    animationRunning = true;

    status("Animation playing");
  }


  // -------------------------
  // STOP
  // -------------------------

  function stopAnimation() {

    animationRunning = false;

    status("Animation stopped");
  }


  // -------------------------
  // TIMELINE
  // -------------------------

  function changeTimeline(value) {

    animationTime =
      Number(value) / 10;
  }


  function previousFrame() {

    animationTime -= 0.1;

    document.getElementById(
      "timeSlider"
    ).value =
      animationTime * 10;
  }


  function nextFrame() {

    animationTime += 0.1;

    document.getElementById(
      "timeSlider"
    ).value =
      animationTime * 10;
  }


  // -------------------------
  // OBJECT LIST
  // -------------------------

  function updateObjectList() {

    const list =
      document.getElementById("objects");

    list.innerHTML = "";

    objects.forEach((obj,index) => {

      const item =
        document.createElement("div");

      item.className = "object";

      item.innerText =
        (index + 1) +
        ". " +
        obj.userData.type;

      item.onclick = () => {

        obj.position.y += 0.5;

      };

      list.appendChild(item);
    });
  }


  // -------------------------
  // CLEAR
  // -------------------------

  function clearScene() {

    objects.forEach(obj => {

      scene.remove(obj);

    });

    objects = [];

    updateObjectList();

    status("Scene cleared");
  }


  // -------------------------
  // SAVE
  // -------------------------

  function saveScene() {

    const data =
      objects.map(obj => ({

        type: obj.userData.type,

        x: obj.position.x,
        y: obj.position.y,
        z: obj.position.z,

        rotationY:
          obj.rotation.y

      }));

    localStorage.setItem(
      "animation3D",
      JSON.stringify(data)
    );

    status("Scene saved");
  }


  // -------------------------
  // LOAD
  // -------------------------

  function loadScene() {

    const saved =
      localStorage.getItem(
        "animation3D"
      );

    if(!saved) {

      status("No saved scene");

      return;
    }

    clearScene();

    const data =
      JSON.parse(saved);

    data.forEach(item => {

      let obj;

      if(item.type === "Car")
        addCar();

      else if(item.type === "Sphere")
        addSphere();

      else
        addCube();

      obj =
        objects[objects.length - 1];

      obj.position.set(
        item.x,
        item.y,
        item.z
      );

      obj.rotation.y =
        item.rotationY;
    });

    status("Scene loaded");
  }


  // -------------------------
  // STATUS
  // -------------------------

  function status(text) {

    document.getElementById(
      "status"
    ).innerText = text;
  }


  // -------------------------
  // RESIZE
  // -------------------------

  window.addEventListener(
    "resize",
    () => {

      const container =
        document.getElementById("scene");

      camera.aspect =
        container.clientWidth /
        container.clientHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        container.clientWidth,
        container.clientHeight
      );
    }
  );


  init();

</script>

</body>
</html>
